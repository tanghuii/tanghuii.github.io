<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hui Tang | Academic Homepage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@400;500;600&family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&family=Pinyon+Script&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1a2e;
      --paper: #faf8f5;
      --accent: #6b4c3b;
      --accent-light: #a67c52;
      --subtle: #d4cdc4;
      --muted: #8a8279;
      --highlight: #f0ebe4;
      --card-bg: #ffffff;
      --shadow: rgba(26, 26, 46, 0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    body.zh { font-family: 'Noto Serif SC', 'DM Sans', serif; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 50;
      backdrop-filter: blur(16px);
      background: rgba(250, 248, 245, 0.85);
      border-bottom: 1px solid var(--subtle);
      transition: box-shadow 0.3s;
    }
    nav.scrolled { box-shadow: 0 2px 20px var(--shadow); }

    .nav-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .nav-name {
      font-family: 'Crimson Pro', serif;
      font-weight: 600;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      color: var(--accent);
      transition: opacity 0.25s;
    }
    .nav-name:hover { opacity: 0.7; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-links { display: flex; gap: 2rem; }
    .hamburger { display: none; }

    .nav-links a {
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.25s;
      position: relative;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1.5px;
      background: var(--accent);
      transition: width 0.3s ease;
    }
    .nav-links a:hover { color: var(--accent); }
    .nav-links a:hover::after { width: 100%; }

    .nav-pub {
      background: var(--accent) !important;
      color: #fff !important;
      padding: 0.35rem 0.9rem !important;
      border-radius: 100px;
      text-transform: uppercase;
      font-size: 0.82rem !important;
      letter-spacing: 0.04em;
      transition: all 0.25s;
    }
    .nav-pub::after { display: none !important; }
    .nav-pub:hover {
      background: var(--accent-light) !important;
      color: #fff !important;
      transform: translateY(-1px);
    }

    /* ── Language Toggle ── */
    .lang-toggle {
      display: flex;
      align-items: center;
      border: 1px solid var(--subtle);
      border-radius: 100px;
      overflow: hidden;
      background: var(--card-bg);
      flex-shrink: 0;
    }
    .lang-btn {
      padding: 0.3rem 0.7rem;
      font-size: 0.75rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.25s;
      letter-spacing: 0.03em;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .hero {
      max-width: 960px;
      margin: 0 auto;
      padding: 90px 2rem 28px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 3rem;
      align-items: start;
    }

    .avatar-wrapper {
      position: relative;
      animation: fadeSlideUp 0.8s ease both;
    }

    .avatar {
      width: 220px;
      height: 270px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      color: var(--muted);
      border: 1px solid var(--subtle);
    }

    .avatar-decorator {
      position: absolute;
      top: -8px;
      left: -8px;
      width: 60px;
      height: 60px;
      border-left: 2px solid var(--accent-light);
      border-top: 2px solid var(--accent-light);
      border-radius: 4px 0 0 0;
      opacity: 0.5;
    }

    .hero-text {
      padding-top: 0.5rem;
      animation: fadeSlideUp 0.8s ease 0.15s both;
    }

    .hero-text h1 {
      font-family: 'Crimson Pro', serif;
      font-size: 2.6rem;
      font-weight: 300;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .affiliation {
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    .bio {
      font-size: 0.98rem;
      color: #444;
      line-height: 1.85;
      max-width: 560px;
    }

    .contact-row {
      margin-top: 1.8rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .contact-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.1rem;
      border: 1px solid var(--subtle);
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      background: var(--card-bg);
      transition: all 0.25s;
      letter-spacing: 0.02em;
    }
    .contact-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--shadow);
    }
    .contact-btn svg { width: 15px; height: 15px; opacity: 0.7; }

    section {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 2rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.6rem;
    }

    .section-header h2 {
      font-family: 'Crimson Pro', serif;
      font-size: 1.6rem;
      font-weight: 400;
      color: var(--ink);
      white-space: nowrap;
    }
    body.zh .section-header h2 { font-family: 'Noto Serif SC', serif; }

    .section-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--subtle), transparent);
    }

    .research-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .tag {
      padding: 0.55rem 1.3rem;
      background: var(--highlight);
      border-radius: 100px;
      font-size: 0.88rem;
      color: var(--accent);
      font-weight: 500;
      border: 1px solid transparent;
      transition: all 0.25s;
    }
    .tag:hover {
      border-color: var(--accent-light);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--shadow);
    }

    .timeline {
      position: relative;
      padding-left: 28px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;
      width: 1.5px;
      background: linear-gradient(to bottom, var(--accent-light), var(--subtle));
    }

    .timeline-item {
      position: relative;
      padding-bottom: 1.3rem;
    }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -25px;
      top: 7px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--paper);
      border: 2px solid var(--accent-light);
      z-index: 1;
    }
    .timeline-item:first-child::before {
      background: var(--accent);
      border-color: var(--accent);
    }

    .timeline-period {
      font-family: 'Crimson Pro', serif;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.2rem;
    }
    .timeline-degree {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.15rem;
    }
    .timeline-school {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .timeline-detail {
      font-size: 0.83rem;
      color: var(--muted);
      font-style: italic;
    }

    .timeline-item-inner {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .school-logo-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
      cursor: pointer;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 2px;
    }
    .school-logo {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      object-fit: contain;
      background: transparent;
      border: 1px solid var(--subtle);
      padding: 6px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: block;
    }
    .school-logo-wrap:hover .school-logo {
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(107, 76, 59, 0.18);
      border-color: var(--accent-light);
    }
    .school-logo-wrap .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(107, 76, 59, 0.25);
      transform: scale(0);
      animation: rippleAnim 0.55s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    .pub-year {
      font-family: 'Crimson Pro', serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 1.2rem;
      margin-bottom: 0.7rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px dashed var(--subtle);
    }
    .pub-year:first-child { margin-top: 0; }

    .pub-item {
      padding: 1.3rem 1.6rem;
      margin-bottom: 1rem;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.3s;
    }
    .pub-item:hover {
      border-color: var(--subtle);
      box-shadow: 0 6px 24px var(--shadow);
      transform: translateY(-2px);
    }

    .pub-item .pub-title {
      font-weight: 600;
      font-size: 0.98rem;
      color: var(--ink);
      margin-bottom: 0.35rem;
      line-height: 1.5;
    }
    .pub-item .pub-authors {
      font-size: 0.87rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .pub-item .pub-authors strong {
      color: var(--accent);
      font-weight: 600;
    }
    .pub-item .pub-venue {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--accent-light);
    }

    .pub-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      margin-left: 0.5rem;
      vertical-align: middle;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-first { background: #fef3c7; color: #92400e; }
    .badge-review { background: #e0e7ff; color: #3730a3; }

    .pub-links {
      margin-top: 0.7rem;
      display: flex;
      gap: 0.6rem;
    }
    .pub-link {
      font-size: 0.78rem;
      font-weight: 500;
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--subtle);
      border-radius: 4px;
      text-decoration: none;
      color: var(--muted);
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .pub-link:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ── View All Button ── */
    .view-all-btn {
      display: block;
      text-align: center;
      padding: 0.8rem 1.5rem;
      margin: 0 0 2rem;
      background: var(--card-bg);
      border: 1px solid var(--subtle);
      border-radius: 8px;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: all 0.25s;
    }
    .view-all-btn:hover {
      border-color: var(--accent);
      background: var(--highlight);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--shadow);
    }

    /* ── Collapsible Year Sections ── */
    .collapsible-section {
      margin-bottom: 0.5rem;
    }
    .year-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.7rem 1.2rem;
      background: var(--highlight);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Crimson Pro', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      transition: all 0.2s;
    }
    .year-toggle:hover {
      border-color: var(--subtle);
      background: var(--card-bg);
    }
    .toggle-icon {
      font-size: 0.85rem;
      transition: transform 0.25s;
    }
    .year-toggle.open .toggle-icon {
      transform: rotate(90deg);
    }
    .year-content {
      padding: 0.5rem 0 0;
    }

    .photo-carousel {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 2rem;
      position: relative;
    }
    .photo-carousel .slides {
      width: 100%;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: var(--ink);
    }
    .photo-carousel .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .photo-carousel .slide.active { opacity: 1; z-index: 1; }
    .photo-carousel .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: brightness(0.88);
    }
    .photo-carousel .photo-caption {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.75);
      font-style: italic;
      letter-spacing: 0.03em;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      transition: opacity 0.5s;
      z-index: 2;
    }
    .carousel-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      opacity: 0;
      z-index: 3;
    }
    .photo-carousel:hover .carousel-nav { opacity: 1; }
    .carousel-nav:hover { background: rgba(255,255,255,0.45); }
    .carousel-nav.prev { left: calc(2rem + 10px); }
    .carousel-nav.next { right: calc(2rem + 10px); }
    .carousel-dots {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 2;
    }
    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: all 0.25s;
    }
    .carousel-dot.active {
      background: rgba(255,255,255,0.9);
      transform: scale(1.3);
    }

    @media (max-width: 720px) {
      .carousel-nav { opacity: 1; width: 30px; height: 30px; font-size: 0.9rem; }
    }

    .awards-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .award-item {
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
      padding: 0.75rem 1.2rem;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .award-item:hover { background: var(--highlight); }
    .award-year {
      font-family: 'Crimson Pro', serif;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--accent);
      min-width: 80px;
      flex-shrink: 0;
    }
    .award-text {
      font-size: 0.93rem;
      color: var(--ink);
    }
    .award-note {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      background: #fef3c7;
      color: #92400e;
      margin-left: 0.5rem;
      vertical-align: middle;
    }
    .highlight-award {
      background: linear-gradient(90deg, rgba(166,124,82,0.06) 0%, transparent 100%);
    }
    .highlight-award .award-text { font-weight: 600; }

    .cv-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--subtle);
      border-radius: 10px;
      padding: 2rem 2.5rem;
      transition: all 0.3s;
    }
    .cv-card:hover {
      box-shadow: 0 8px 32px var(--shadow);
      transform: translateY(-2px);
    }
    .cv-info h3 {
      font-family: 'Crimson Pro', serif;
      font-size: 1.25rem;
      font-weight: 400;
      margin-bottom: 0.3rem;
    }
    .cv-info p {
      font-size: 0.88rem;
      color: var(--muted);
    }
    .cv-download {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.6rem;
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      transition: all 0.25s;
    }
    .cv-download:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(107, 76, 59, 0.25);
    }
    .cv-download svg { width: 16px; height: 16px; }

    /* ── Network Box ── */
    .network-box {
      width: 100%;
      aspect-ratio: 5 / 3;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--subtle);
      position: relative;
      overflow: hidden;
    }
    @media (max-width: 720px) {
      .network-box { aspect-ratio: 1 / 1.5; }
    }

    footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      border-top: 1px solid var(--subtle);
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a.admin-link { color: var(--muted); }
    footer a.admin-link:hover { color: var(--accent); }
    /* Admin entry in the nav bar */
    .admin-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 1px solid var(--subtle); border-radius: 100px; background: var(--card-bg); color: var(--muted); flex-shrink: 0; transition: all 0.25s; }
    .admin-btn:hover { color: var(--accent); border-color: var(--accent); }
    .admin-btn svg { width: 14px; height: 14px; }

    /* ── Like Button ── */
    .like-btn {
      cursor: pointer;
      transition: all 0.3s;
    }
    .like-btn:hover {
      border-color: #e25555 !important;
      color: #e25555 !important;
    }
    .like-btn.liked {
      background: linear-gradient(135deg, #e25555, #d94040) !important;
      color: #fff !important;
      border-color: transparent !important;
    }
    .like-btn .heart {
      font-size: 1rem;
      transition: transform 0.3s;
    }
    .like-btn:hover .heart { transform: scale(1.2); }
    .like-btn.liked .heart { animation: heartPop 0.4s ease; }
    @keyframes heartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 0.8rem 1.6rem;
      border-radius: 8px;
      font-size: 0.88rem;
      opacity: 0;
      transition: all 0.4s ease;
      z-index: 200;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { opacity: 1; transform: translateY(0); }

    @media (max-width: 720px) {
      .hamburger {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        width: 28px;
        height: 28px;
        cursor: pointer;
        z-index: 60;
        background: none;
        border: none;
        padding: 0;
      }
      .hamburger span {
        display: block;
        width: 100%;
        height: 2px;
        background: var(--accent);
        border-radius: 2px;
        transition: all 0.3s ease;
      }
      .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
      .hamburger.active span:nth-child(2) { opacity: 0; }
      .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

      .nav-links {
        display: none;
        position: absolute;
        top: 60px;
        left: 0;
        right: 0;
        flex-direction: column;
        gap: 0;
        background: rgba(250, 248, 245, 0.97);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--subtle);
        box-shadow: 0 8px 24px var(--shadow);
        padding: 0.5rem 0;
      }
      .nav-links.open { display: flex; }
      .nav-links a {
        padding: 1rem 2rem;
        font-size: 0.9rem;
        border-bottom: 1px solid var(--highlight);
        text-transform: none;
        letter-spacing: 0.01em;
      }
      .nav-links a:last-child { border-bottom: none; }
      .nav-links a::after { display: none; }
      .nav-links a:hover { background: var(--highlight); }

      .hero {
        grid-template-columns: 1fr;
        padding: 80px 1.5rem 28px;
        gap: 1.5rem;
        text-align: center;
      }
      .avatar-wrapper { margin: 0 auto; }
      .avatar { width: 160px; height: 200px; font-size: 3.5rem; }
      .hero-text h1 { font-size: 2rem; }
      .affiliation { justify-content: center; }
      .bio { margin: 0 auto; }
      .contact-row { justify-content: center; }
      .cv-card { flex-direction: column; gap: 1.5rem; text-align: center; }
    }
  </style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  // ───────────────────────────────────────────────────────────────
  // Content-driven rendering. All text comes from content.json.
  // ───────────────────────────────────────────────────────────────
  let currentLang = 'en';
  let CONTENT = null;

  // Escape text for safe insertion as HTML
  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Escape an HTML string for use inside a double-quoted attribute
  const attr = s => String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  // Build a bilingual element. `en`/`zh` are HTML strings; `extra` is HTML kept across language switches
  function bi(tag, en, zh, cls = '', extra = '', style = '') {
    return `<${tag}${cls ? ` class="${cls}"` : ''}${style ? ` style="${style}"` : ''} data-en="${attr(en)}" data-zh="${attr(zh)}">${en}${extra}</${tag}>`;
  }
  const T = o => ({ en: esc(o?.en ?? ''), zh: esc(o?.zh ?? '') });

  const ICONS = {
    email: '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>',
    scholar: '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 14l9-5-9-5-9 5 9 5z"/><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>',
    researchgate: '<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M19.586 0c-1.373 0-2.488 1.116-2.488 2.488 0 1.373 1.116 2.488 2.488 2.488 1.373 0 2.488-1.116 2.488-2.488C22.074 1.116 20.959 0 19.586 0zM3.488 0C2.116 0 1 1.116 1 2.488S2.116 4.977 3.488 4.977c1.373 0 2.488-1.116 2.488-2.488S4.861 0 3.488 0zM1 7.209v16.791h4.977V7.209H1zm15.163 0c-2.252 0-3.291 1.207-3.86 2.063V7.209H7.372v16.791h4.931v-9.355c0-.502.04-1.004.186-1.363.407-1.004 1.207-2.044 2.665-2.044 1.881 0 2.665 1.542 2.665 3.768v8.994h4.931v-9.637c0-5.159-2.756-7.554-6.387-7.554z"/></svg>',
    orcid: '<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.372 0 0 5.372 0 12s5.372 12 12 12 12-5.372 12-12S18.628 0 12 0zM7.369 4.378c.525 0 .947.431.947.947s-.422.947-.947.947a.95.95 0 0 1-.947-.947c0-.525.422-.947.947-.947zm-.722 3.038h1.444v10.041H6.647V7.416zm3.562 0h3.9c3.712 0 5.344 2.653 5.344 5.025 0 2.578-2.016 5.025-5.325 5.025h-3.919V7.416zm1.444 1.303v7.444h2.297c3.272 0 4.022-2.484 4.022-3.722 0-2.016-1.284-3.722-4.097-3.722h-2.222z"/></svg>',
    github: '<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>',
    linkedin: '<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/></svg>',
    other: '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>'
  };

  // ── Section renderers ──
  function renderHero(p) {
    const aff = T(p.affiliation), bio = T(p.bio);
    const links = (p.links || []).map(l =>
      `<a class="contact-btn" href="${attr(l.url)}" target="_blank" rel="noopener">${ICONS[l.icon] || ICONS.other} ${esc(l.label)}</a>`).join('');
    // Email is obfuscated: assembled on click, never present in the static HTML
    const emailParts = JSON.stringify((p.email || '').split('@'));
    const emailBtn = p.email ? `<a class="contact-btn" href="#" onclick="this.href='mai'+'lto:'+${attr(emailParts)}.join('@'); return true;">${ICONS.email} Email</a>` : '';
    document.getElementById('about').innerHTML = `
      <div class="avatar-wrapper">
        <div class="avatar-decorator"></div>
        <img class="avatar" src="${attr(p.photo)}" alt="${attr(p.name_en)}">
      </div>
      <div class="hero-text">
        <h1>${esc(p.name_en)} <span style="font-family: 'Ma Shan Zheng', cursive; font-weight: 400; font-size: 2.2rem; color: var(--accent); margin-left: 0.4rem;">${esc(p.name_zh)}</span></h1>
        ${bi('div', aff.en, aff.zh, 'affiliation')}
        ${bi('p', bio.en, bio.zh, 'bio')}
        <div class="contact-row">
          ${emailBtn}${links}
          <button class="contact-btn like-btn" id="likeBtn" onclick="handleLike()">
            <span class="heart">&#128077;</span>
            <span id="likeText" data-en="Like" data-zh="点赞">Like</span>
            <span id="likeCount">0</span>
          </button>
        </div>
      </div>`;
    document.getElementById('nav-name').textContent = p.name_en;
  }

  function renderResearch(list) {
    document.getElementById('research-tags').innerHTML = list.map(t => { const x = T(t); return bi('span', x.en, x.zh, 'tag'); }).join('');
  }

  function renderEducation(list) {
    const linkStyle = "color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--subtle)";
    document.getElementById('education-timeline').innerHTML = list.map(e => {
      const deg = T(e.degree), sch = T(e.school);
      let detail = '';
      if (e.supervisors && e.supervisors.length) {
        const a = (s, lang) => `<a href='${attr(s.url)}' target='_blank' style='${linkStyle}'>${esc(s[lang] || s.en)}</a>`;
        const en = 'Supervised by ' + e.supervisors.map(s => 'Prof. ' + a(s, 'en')).join(' &amp; ');
        const zh = '导师：' + e.supervisors.map(s => a(s, 'zh') + ' 教授').join('、');
        detail = bi('div', en, zh, 'timeline-detail');
      }
      return `<div class="timeline-item"><div class="timeline-item-inner">
        <div class="school-logo-wrap" onclick="logoRipple(event)" title="${attr(e.logo_title)}"><img class="school-logo" src="${attr(e.logo)}" alt="${attr(e.logo_title)}"></div>
        <div>
          <div class="timeline-period">${esc(e.period)}</div>
          ${bi('div', deg.en, deg.zh, 'timeline-degree')}
          ${bi('div', sch.en, sch.zh, 'timeline-school')}
          ${detail}
        </div></div></div>`;
    }).join('');
  }

  function renderCarousel(id, slides) {
    const credit = T(CONTENT.site.photo_credit);
    const sep = ' &nbsp;&middot;&nbsp; ';
    document.getElementById(id).innerHTML = `<div class="slides">${slides.map((s, i) => {
      const c = T(s.caption);
      return `<div class="slide${i === 0 ? ' active' : ''}"><img src="${attr(s.src)}" alt="${attr(s.caption?.en || '')}"${i > 0 ? ' loading="lazy"' : ''}>${bi('span', c.en + sep + credit.en, c.zh + sep + credit.zh, 'photo-caption')}</div>`;
    }).join('')}</div>
      <button class="carousel-nav prev" onclick="slideCarousel('${id}',-1)">&#10094;</button>
      <button class="carousel-nav next" onclick="slideCarousel('${id}',1)">&#10095;</button>
      <div class="carousel-dots"></div>`;
  }

  function pubBadges(p) {
    let b = '';
    if (p.first_author) b += ' <span class="pub-badge badge-first">First Author</span>';
    if (p.status) b += ` <span class="pub-badge badge-review">${esc(p.status)}</span>`;
    return b;
  }
  function pubItem(p, style = '') {
    const link = p.url ? `<div class="pub-links"><a class="pub-link" href="${attr(p.url)}" target="_blank" data-en="Read in publisher" data-zh="查看原文">Read in publisher</a></div>` : '';
    return `<div class="pub-item"${style ? ` style="${style}"` : ''}>
      <div class="pub-title">${esc(p.title_short || p.title)}${pubBadges(p)}</div>
      <div class="pub-authors">${p.authors}</div>
      <div class="pub-venue">${esc(p.venue)}</div>${link}</div>`;
  }
  function renderPublications(pubs) {
    const featured = pubs.filter(p => p.featured);
    document.getElementById('pub-featured').innerHTML = featured.length ? `<div style="margin-bottom:1.5rem;">
      ${bi('div', '⭐ Featured', '⭐ 代表性成果', '', '', 'font-size:0.82rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent);margin-bottom:0.8rem;')}
      ${featured.map(p => pubItem(p, 'border:1px solid var(--accent-light);background:linear-gradient(135deg, var(--highlight) 0%, var(--card-bg) 100%);')).join('')}</div>` : '';
    // Group by year, newest first, books last
    const groups = {};
    pubs.forEach(p => { (groups[p.year] = groups[p.year] || []).push(p); });
    const years = Object.keys(groups).filter(y => y !== 'book').sort((a, b) => b.localeCompare(a));
    if (groups.book) years.push('book');
    document.getElementById('pub-years').innerHTML = years.map(y => `<div class="collapsible-section">
      <button class="year-toggle" onclick="toggleYear(this)">${y === 'book' ? '<span data-en="Book" data-zh="著作">Book</span>' : `<span>${esc(y)}</span>`}<span class="toggle-icon">▸</span></button>
      <div class="year-content" style="display:none;">${groups[y].map(p => pubItem(p)).join('')}</div></div>`).join('');
  }

  function renderAwards(list) {
    document.getElementById('awards-list').innerHTML = list.map(a => {
      const t = T(a.text);
      const note = a.note ? ` <span class="award-note">${esc(a.note)}</span>` : '';
      return `<div class="award-item${a.highlight ? ' highlight-award' : ''}"><span class="award-year">${esc(a.year)}</span>${bi('span', t.en, t.zh, 'award-text', note)}</div>`;
    }).join('');
  }

  function renderCV(cv) {
    const u = T(cv.updated);
    document.getElementById('cv-card').innerHTML = `<div class="cv-info">
        <h3 data-en="Full CV" data-zh="完整简历">Full CV</h3>${bi('p', u.en, u.zh)}</div>
      <a class="cv-download" href="${attr(encodeURI(cv.file))}" download>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span data-en="Download PDF" data-zh="下载 PDF">Download PDF</span></a>`;
  }

  function renderFooter(site) {
    document.getElementById('footer').innerHTML = `<p>&copy; ${esc(site.footer_year)} ${esc(CONTENT.profile.name_en)} &nbsp;&middot;&nbsp; Hosted on <a href="https://pages.github.com/" target="_blank">GitHub Pages</a> &nbsp;&middot;&nbsp; <a href="admin.html" rel="nofollow" class="admin-link" title="Site Manager">Admin</a></p>`;
  }

  // Inject GoatCounter if a site code is configured (privacy-friendly analytics)
  function injectGoatCounter(code) {
    if (!code) return;
    const s = document.createElement('script');
    s.async = true;
    s.dataset.goatcounter = `https://${code}.goatcounter.com/count`;
    s.src = '//gc.zgo.at/count.js';
    document.head.appendChild(s);
  }

  // ── Language Toggle ──
  function applyLang(lang) {
    currentLang = lang;
    document.querySelectorAll('#lang-toggle .lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    document.body.classList.toggle('zh', lang === 'zh');
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-en][data-zh]').forEach(el => {
      // Preserve child elements like .award-note and .pub-badge
      const notes = el.querySelectorAll('.award-note, .pub-badge');
      let preserved = '';
      notes.forEach(n => { preserved += ' ' + n.outerHTML; });
      el.innerHTML = el.getAttribute('data-' + lang) + preserved;
    });
    if (CONTENT) document.title = CONTENT.site.title[lang] || CONTENT.site.title.en;
  }
  document.getElementById('lang-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('.lang-btn');
    if (!btn || btn.dataset.lang === currentLang) return;
    applyLang(btn.dataset.lang);
  });

  // ── Boot ──
  async function boot() {
    try {
      const res = await fetch('content.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      CONTENT = await res.json();
    } catch (err) {
      document.getElementById('about').innerHTML = `<p style="grid-column:1/-1;color:var(--muted)">Failed to load content.json (${esc(err.message)}).</p>`;
      return;
    }
    renderHero(CONTENT.profile);
    renderResearch(CONTENT.research_interests || []);
    renderEducation(CONTENT.education || []);
    renderCarousel('carousel1', (CONTENT.carousels || [])[0] || []);
    renderCarousel('carousel2', (CONTENT.carousels || [])[1] || []);
    renderPublications(CONTENT.publications || []);
    renderAwards(CONTENT.awards || []);
    renderCV(CONTENT.cv || {});
    renderFooter(CONTENT.site || {});
    injectGoatCounter(CONTENT.site?.goatcounter_code);
    applyLang(currentLang);
    initLike();
    initCarousel('carousel1');
    initCarousel('carousel2');
    initNetworkWhenVisible();
  }

  // ── Nav scroll shadow ──
  window.addEventListener('scroll', () => {
    document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 10);
  });

  // ── Fade-in on scroll ──
  const fadeObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.15 });
  document.querySelectorAll('.fade-in').forEach(el => fadeObserver.observe(el));

  // ── Hamburger menu toggle ──
  const hamburger = document.getElementById('hamburger');
  const navLinks = document.getElementById('nav-links');
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('active');
    navLinks.classList.toggle('open');
  });
  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      hamburger.classList.remove('active');
      navLinks.classList.remove('open');
    });
  });

  // ── Collapsible Year Sections ──
  function toggleYear(btn) {
    btn.classList.toggle('open');
    const content = btn.nextElementSibling;
    content.style.display = content.style.display === 'none' ? 'block' : 'none';
  }
  window.toggleYear = toggleYear;

  // ── School Logo Ripple ──
  function logoRipple(e) {
    const wrap = e.currentTarget;
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(wrap.offsetWidth, wrap.offsetHeight);
    const rect = wrap.getBoundingClientRect();
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    wrap.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
  }

  // ── Like Button (CountAPI for global count + localStorage to prevent repeat likes) ──
  const LIKE_API = 'https://countapi.mileshilliard.com/api/v1';
  const LIKE_KEY = 'hui-tang-academic-homepage-likes';
  let hasLiked = false;
  function initLike() {
    try { hasLiked = localStorage.getItem('hasLiked') === 'true'; } catch (e) {}
    if (hasLiked) document.getElementById('likeBtn').classList.add('liked');
    loadLikeCount();
  }
  async function loadLikeCount() {
    const el = document.getElementById('likeCount');
    try {
      const res = await fetch(LIKE_API + '/get/' + LIKE_KEY);
      if (res.ok) { const data = await res.json(); el.textContent = data.value || 0; }
    } catch (e) {
      try { el.textContent = localStorage.getItem('likeCountLocal') || '0'; } catch (_) {}
    }
  }
  async function handleLike() {
    if (hasLiked) return;
    hasLiked = true;
    try { localStorage.setItem('hasLiked', 'true'); } catch (e) {}
    document.getElementById('likeBtn').classList.add('liked');
    const el = document.getElementById('likeCount');
    try {
      const res = await fetch(LIKE_API + '/hit/' + LIKE_KEY);
      if (res.ok) { const data = await res.json(); el.textContent = data.value; try { localStorage.setItem('likeCountLocal', data.value); } catch (_) {} }
    } catch (e) {
      let local = 0; try { local = parseInt(localStorage.getItem('likeCountLocal') || '0') + 1; localStorage.setItem('likeCountLocal', local); } catch (_) {}
      el.textContent = local;
    }
    const toast = document.getElementById('toast');
    toast.textContent = currentLang === 'zh' ? '感谢您的支持！' : 'Thank you for your support!';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // ── Photo Carousels ──
  const carousels = {};
  const autoplayInterval = 5000;
  function initCarousel(id) {
    const el = document.getElementById(id);
    const slides = el.querySelectorAll('.slide');
    if (!slides.length) { el.style.display = 'none'; return; }
    const dotsContainer = el.querySelector('.carousel-dots');
    slides.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
      dot.onclick = () => goToSlide(id, i);
      dotsContainer.appendChild(dot);
    });
    carousels[id] = {
      el, slides, current: 0,
      dots: dotsContainer.querySelectorAll('.carousel-dot'),
      timer: setInterval(() => slideCarousel(id, 1), autoplayInterval)
    };
    el.addEventListener('mouseenter', () => clearInterval(carousels[id].timer));
    el.addEventListener('mouseleave', () => {
      carousels[id].timer = setInterval(() => slideCarousel(id, 1), autoplayInterval);
    });
  }
  function goToSlide(id, index) {
    const c = carousels[id];
    c.slides[c.current].classList.remove('active');
    c.dots[c.current].classList.remove('active');
    c.current = index;
    c.slides[c.current].classList.add('active');
    c.dots[c.current].classList.add('active');
  }
  function slideCarousel(id, dir) {
    const c = carousels[id];
    if (!c) return;
    goToSlide(id, (c.current + dir + c.slides.length) % c.slides.length);
  }

  // ── Collaboration Network (D3.js), derived from publication author lists ──
  function authorsOf(p) {
    const tmp = document.createElement('div');
    tmp.innerHTML = p.authors || '';
    return tmp.textContent.split(',').map(s => s.replace(/\*/g, '').trim()).filter(Boolean);
  }
  function initNetworkWhenVisible() {
    const container = document.getElementById('network-container');
    let initialized = false;
    const obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !initialized) {
        initialized = true;
        obs.disconnect();
        initNetwork();
      }
    }, { threshold: 0.1 });
    obs.observe(container);
  }
  function initNetwork() {
    const ME = CONTENT.site.me_author || 'Tang H.';
    const papers = (CONTENT.publications || []).map(p => ({ authors: authorsOf(p) }));

    const coauthorCount = {};
    const linkMap = {};
    papers.forEach(p => {
      p.authors.forEach(a => { coauthorCount[a] = (coauthorCount[a] || 0) + 1; });
      for (let i = 0; i < p.authors.length; i++) {
        for (let j = i + 1; j < p.authors.length; j++) {
          const key = [p.authors[i], p.authors[j]].sort().join('|');
          linkMap[key] = (linkMap[key] || 0) + 1;
        }
      }
    });
    // The most frequent co-author (other than me) gets the secondary colour
    const top = Object.entries(coauthorCount).filter(([n]) => n !== ME).sort((a, b) => b[1] - a[1])[0]?.[0];
    const nodes = Object.entries(coauthorCount).map(([name, count]) => ({
      id: name, count, isMe: name === ME, group: name === ME ? 0 : name === top ? 1 : 2
    }));
    const links = Object.entries(linkMap).map(([key, value]) => {
      const [s, t] = key.split('|');
      return { source: s, target: t, value };
    });

    const container = document.getElementById('network-container');
    const svg = document.getElementById('network-svg');
    const rect = container.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const accent = '#6b4c3b', accentLight = '#a67c52', muted = '#8a8279';

    const sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(d => 160 - d.value * 8).strength(0.4))
      .force('charge', d3.forceManyBody().strength(-500))
      .force('center', d3.forceCenter(W / 2, H / 2))
      .force('collision', d3.forceCollide().radius(d => nodeR(d) + 14))
      .force('x', d3.forceX(W / 2).strength(0.04))
      .force('y', d3.forceY(H / 2).strength(0.04));
    function nodeR(d) { return d.isMe ? 34 : Math.max(12, Math.sqrt(d.count) * 10); }

    const svgSel = d3.select('#network-svg');
    const link = svgSel.selectAll('line').data(links).enter().append('line')
      .attr('stroke', '#d4cdc4').attr('stroke-width', d => Math.max(1, d.value * 1.2)).attr('stroke-opacity', 0.6);
    const node = svgSel.selectAll('g.node').data(nodes).enter().append('g').attr('class', 'node').style('cursor', 'grab')
      .call(d3.drag()
        .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
    const tip = document.getElementById('network-tooltip');
    node.append('circle')
      .attr('r', d => nodeR(d))
      .attr('fill', d => d.isMe ? accent : d.group === 1 ? accentLight : '#c4b5a5')
      .attr('stroke', d => d.isMe ? '#1a1a2e' : 'transparent')
      .attr('stroke-width', d => d.isMe ? 2.5 : 0)
      .attr('opacity', 0.9)
      .on('mouseover', function (e, d) {
        d3.select(this).transition().duration(200).attr('opacity', 1).attr('r', nodeR(d) * 1.2);
        tip.textContent = currentLang === 'zh' ? `${d.id} · 合作论文 ${d.count} 篇` : `${d.id} · ${d.count} paper${d.count > 1 ? 's' : ''}`;
        tip.style.display = 'block';
        const r = container.getBoundingClientRect();
        tip.style.left = (e.clientX - r.left + 12) + 'px'; tip.style.top = (e.clientY - r.top - 30) + 'px';
      })
      .on('mousemove', function (e) {
        const r = container.getBoundingClientRect();
        tip.style.left = (e.clientX - r.left + 12) + 'px'; tip.style.top = (e.clientY - r.top - 30) + 'px';
      })
      .on('mouseout', function (e, d) {
        d3.select(this).transition().duration(200).attr('opacity', 0.9).attr('r', nodeR(d));
        tip.style.display = 'none';
      });
    node.append('text').text(d => d.id.replace('.', '')).attr('text-anchor', 'middle').attr('dy', d => nodeR(d) + 14)
      .attr('font-size', d => d.isMe ? '11px' : '9px').attr('font-weight', d => d.isMe ? '700' : '500')
      .attr('fill', d => d.isMe ? accent : muted).attr('font-family', "'DM Sans', sans-serif");
    node.filter(d => d.isMe || d.count >= 3).append('text').text(d => d.count).attr('text-anchor', 'middle').attr('dy', '0.35em')
      .attr('font-size', d => d.isMe ? '12px' : '9px').attr('font-weight', '700').attr('fill', '#fff').attr('font-family', "'DM Sans', sans-serif");
    sim.on('tick', () => {
      link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });
  }

  boot();
</script>
</body>
</html>
