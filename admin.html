<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Site Manager · Hui Tang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: fixed left rail with sections, scrolling main pane; same palette as the public site */
  :root {
    --ink: #1a1a2e; --paper: #faf8f5; --accent: #6b4c3b; --accent-light: #a67c52;
    --subtle: #d4cdc4; --muted: #8a8279; --highlight: #f0ebe4; --card: #ffffff;
    --ok: #2f7a4f; --ok-bg: #e6f3ea; --warn: #92400e; --warn-bg: #fef3c7; --err: #b42318; --err-bg: #fde8e6;
    --shadow: rgba(26,26,46,0.06);
    --serif: 'Crimson Pro', Georgia, serif; --sans: 'DM Sans', system-ui, sans-serif; --mono: 'DM Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--sans); background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  input[type=text], input[type=url], input[type=password], input[type=number], select, textarea {
    width: 100%; padding: 0.5rem 0.65rem; border: 1px solid var(--subtle); border-radius: 6px; background: var(--card);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-light); outline-offset: 1px; border-color: var(--accent-light); }
  textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
  textarea.mono, input.mono { font-family: var(--mono); font-size: 12.5px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 0.3rem; }
  .field { margin-bottom: 0.9rem; min-width: 0; }
  .row { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .row.two { grid-template-columns: 1fr 1fr; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 0.3rem; }
  .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; border: 1px solid var(--subtle); border-radius: 6px; background: var(--card); cursor: pointer; font-weight: 500; transition: all .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-light); border-color: var(--accent-light); color: #fff; }
  .btn.danger:hover { border-color: var(--err); color: var(--err); }
  .btn.sm { padding: 0.25rem 0.6rem; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 100px; letter-spacing: 0.03em; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.err { background: var(--err-bg); color: var(--err); }
  .pill.muted { background: var(--highlight); color: var(--muted); }

  .app { display: grid; grid-template-columns: 230px 1fr; height: 100%; }
  aside { border-right: 1px solid var(--subtle); background: var(--card); padding: 1.2rem 0; display: flex; flex-direction: column; }
  .brand { padding: 0 1.2rem 1rem; border-bottom: 1px solid var(--subtle); }
  .brand h1 { font-family: var(--serif); font-weight: 600; font-size: 1.25rem; color: var(--accent); }
  .brand p { font-size: 12px; color: var(--muted); }
  nav { padding: 0.8rem 0.6rem; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  nav button { text-align: left; padding: 0.5rem 0.7rem; border: none; background: none; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
  nav button:hover { background: var(--highlight); color: var(--ink); }
  nav button.active { background: var(--highlight); color: var(--accent); font-weight: 600; }
  nav .count { font-size: 11px; color: var(--muted); font-weight: 500; }
  .aside-foot { padding: 0.8rem 1.2rem 0; border-top: 1px solid var(--subtle); font-size: 12px; color: var(--muted); }
  .aside-foot a { display: block; margin-top: 0.3rem; text-decoration: none; }

  main { overflow-y: auto; min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 5; background: rgba(250,248,245,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--subtle); padding: 0.7rem 1.6rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .topbar .status { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .topbar .actions { display: flex; gap: 0.5rem; }
  .content { padding: 1.6rem; max-width: 1000px; }
  h2 { font-family: var(--serif); font-weight: 400; font-size: 1.5rem; margin-bottom: 0.3rem; }
  .lead { color: var(--muted); margin-bottom: 1.4rem; font-size: 13.5px; }
  .card { background: var(--card); border: 1px solid var(--subtle); border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; }
  .card h3 { font-family: var(--serif); font-weight: 600; font-size: 1.05rem; margin-bottom: 0.8rem; color: var(--accent); }
  .item { background: var(--card); border: 1px solid var(--subtle); border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 0.7rem; }
  .item-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
  .item-head .title { font-weight: 600; flex: 1; min-width: 160px; }
  .item-head .tools { display: flex; gap: 0.3rem; }
  .item-head .tools .btn { padding: 0.2rem 0.5rem; font-size: 12px; }
  .toolbar { display: flex; gap: 0.6rem; margin: 0.5rem 0 1rem; flex-wrap: wrap; align-items: center; }
  .check { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 13px; cursor: pointer; }
  .check input { width: auto; }
  .list-compact .item { padding: 0.7rem 1rem; }
  .pub-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 0.9rem; align-items: center; cursor: pointer; }
  .pub-row img, .pub-row .nocover { width: 48px; height: 64px; object-fit: cover; border-radius: 4px; border: 1px solid var(--subtle); background: var(--highlight); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .pub-row .t { font-weight: 600; line-height: 1.35; }
  .pub-row .m { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .pub-row .m span { margin-right: 0.5rem; }
  .pub-edit { border-top: 1px dashed var(--subtle); margin-top: 0.9rem; padding-top: 0.9rem; }
  .yearhead { font-family: var(--serif); font-weight: 600; color: var(--accent); margin: 1.1rem 0 0.5rem; padding-bottom: 0.25rem; border-bottom: 1px dashed var(--subtle); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.8rem; }
  .thumb { border: 1px solid var(--subtle); border-radius: 8px; overflow: hidden; background: var(--card); }
  .thumb img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; }
  .thumb .cap { padding: 0.5rem 0.6rem; font-size: 12px; }
  .thumb .cap input { padding: 0.3rem 0.4rem; font-size: 12px; margin-top: 0.25rem; }
  .thumb .tools { display: flex; gap: 0.2rem; padding: 0 0.6rem 0.5rem; }
  .thumb .tools .btn { padding: 0.15rem 0.45rem; font-size: 11px; }

  /* Analytics */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.8rem; margin-bottom: 1rem; }
  .tile { background: var(--card); border: 1px solid var(--subtle); border-radius: 10px; padding: 0.9rem 1.1rem; }
  .tile .k { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .tile .v { font-family: var(--serif); font-size: 1.9rem; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .tile .s { font-size: 12px; color: var(--muted); }
  .bars { display: grid; gap: 0.35rem; }
  .bar { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 56px; gap: 0.6rem; align-items: center; font-size: 13px; }
  .bar .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .track { height: 10px; background: var(--highlight); border-radius: 100px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent-light); border-radius: 100px; }
  .bar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .chart { width: 100%; height: 160px; display: block; }
  .seg { display: inline-flex; border: 1px solid var(--subtle); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; background: var(--card); padding: 0.35rem 0.75rem; cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .seg button.active { background: var(--accent); color: #fff; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }

  /* Login / modal */
  .overlay { position: fixed; inset: 0; background: rgba(26,26,46,0.35); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
  .modal { background: var(--card); border-radius: 12px; padding: 1.6rem 1.8rem; width: 100%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal h2 { margin-bottom: 0.6rem; }
  .modal ol { margin: 0.6rem 0 1rem 1.2rem; font-size: 13px; color: #444; }
  .modal ol li { margin-bottom: 0.25rem; }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 0.7rem 1.3rem; border-radius: 8px; font-size: 13px; opacity: 0; transition: all .3s; z-index: 60; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--err); }
  .log { font-family: var(--mono); font-size: 12px; background: var(--highlight); border-radius: 6px; padding: 0.6rem 0.8rem; max-height: 180px; overflow: auto; white-space: pre-wrap; }
  .dirty-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--subtle); padding: 0.8rem 0 0; }
    nav { flex-direction: row; overflow-x: auto; padding: 0.5rem 0.6rem; }
    nav button { white-space: nowrap; }
    nav .count, .aside-foot { display: none; }
    .content { padding: 1rem; }
    .row.two { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <aside>
    <div class="brand">
      <h1>Site Manager</h1>
      <p id="brand-sub">tanghuii.github.io</p>
    </div>
    <nav id="nav"></nav>
    <div class="aside-foot">
      <span id="auth-state">Not signed in</span>
      <a href="#" id="link-signout">Change token…</a>
      <a href="index.html" target="_blank">Open website ↗</a>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="status" id="status">Loading…</div>
      <div class="actions">
        <button class="btn" id="btn-reload">Reload from GitHub</button>
        <button class="btn primary" id="btn-save" disabled>Publish changes</button>
      </div>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Configuration
// ─────────────────────────────────────────────────────────────────────────────
const REPO = { owner: 'tanghuii', name: 'tanghuii.github.io', branch: 'main' };
const CONTENT_PATH = 'content.json';
const SITE_URL = 'https://tanghuii.github.io/';
const LS = { token: 'sm_gh_token', gcToken: 'sm_gc_token', tab: 'sm_tab' };

// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
let C = null;          // working copy of content.json
let C_ORIG = '';       // JSON string of the last loaded/saved version (for dirty check)
let SHA = null;        // blob sha of content.json on GitHub (needed for update)
let TOKEN = null;
let TAB = 'overview';
let openPub = null;    // id of publication currently expanded
let REPO_FILES = null; // cached list of files in the repo root

const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function toast(msg, isErr = false) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), isErr ? 5000 : 2600);
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

// ─────────────────────────────────────────────────────────────────────────────
// GitHub API helpers (Contents API, base64 UTF-8 safe)
// ─────────────────────────────────────────────────────────────────────────────
const b64enc = str => btoa(String.fromCharCode(...new TextEncoder().encode(str)));
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, '')), c => c.charCodeAt(0)));
async function gh(path, opts = {}) {
  const res = await fetch(`https://api.github.com${path}`, {
    ...opts,
    headers: { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) }
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).message || msg; } catch (e) {}
    throw new Error(`GitHub ${res.status}: ${msg}`);
  }
  return res.status === 204 ? null : res.json();
}
async function ghGetFile(path) {
  return gh(`/repos/${REPO.owner}/${REPO.name}/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}?ref=${REPO.branch}`);
}
async function ghPutFile(path, base64Content, message, sha) {
  const body = { message, content: base64Content, branch: REPO.branch };
  if (sha) body.sha = sha;
  return gh(`/repos/${REPO.owner}/${REPO.name}/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}`, { method: 'PUT', body: JSON.stringify(body) });
}
async function ghListRoot(force = false) {
  if (REPO_FILES && !force) return REPO_FILES;
  if (!TOKEN) return [];
  try { REPO_FILES = (await gh(`/repos/${REPO.owner}/${REPO.name}/contents/?ref=${REPO.branch}`)).map(f => f.name); }
  catch (e) { REPO_FILES = []; }
  return REPO_FILES;
}
async function fileToBase64(file) {
  const buf = await file.arrayBuffer();
  let bin = ''; const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
// Upload a file to the repo root (creates or replaces). Returns the final filename.
async function uploadToRepo(file, targetName) {
  const name = (targetName || file.name).replace(/[^\w.\- ]+/g, '_');
  let sha = null;
  try { sha = (await ghGetFile(name)).sha; } catch (e) {}
  await ghPutFile(name, await fileToBase64(file), `${sha ? 'Update' : 'Add'} ${name} via Site Manager`, sha);
  REPO_FILES = null;
  return name;
}

// ─────────────────────────────────────────────────────────────────────────────
// Load / save content.json
// ─────────────────────────────────────────────────────────────────────────────
async function loadContent() {
  setStatus('Loading content…');
  try {
    if (TOKEN) {
      const f = await ghGetFile(CONTENT_PATH);
      SHA = f.sha;
      C = JSON.parse(b64dec(f.content));
    } else {
      // Read-only fallback: the published copy next to this page
      const res = await fetch(CONTENT_PATH, { cache: 'no-cache' });
      if (!res.ok) throw new Error('content.json not found');
      C = await res.json(); SHA = null;
    }
    normalize();
    C_ORIG = JSON.stringify(C);
    setStatus();
    render();
  } catch (e) {
    setStatus(`Could not load content: ${e.message}`, 'err');
    $('#view').innerHTML = `<div class="card"><h3>Could not load content.json</h3><p>${esc(e.message)}</p><p class="hint">If you just set up the site, make sure content.json exists in the repository root, and that the token has <b>Contents: Read and write</b> permission for this repository.</p></div>`;
  }
}
function normalize() {
  C.site ||= {}; C.profile ||= {}; C.profile.links ||= [];
  C.research_interests ||= []; C.education ||= []; C.carousels ||= [[], []];
  C.publications ||= []; C.awards ||= []; C.cv ||= {};
  C.publications.forEach((p, i) => { p.id ||= 'pub' + String(i + 1).padStart(2, '0'); });
}
function isDirty() { return C && JSON.stringify(C) !== C_ORIG; }
function setStatus(msg, kind) {
  const el = $('#status');
  if (msg) { el.innerHTML = `<span class="pill ${kind || 'muted'}">${esc(msg)}</span>`; return; }
  const dirty = isDirty();
  el.innerHTML = dirty
    ? `<span class="dirty-dot"></span> Unpublished changes`
    : `<span class="pill ok">Up to date</span> <span>${TOKEN ? 'Connected to GitHub' : 'Read-only preview (no token)'}</span>`;
  $('#btn-save').disabled = !dirty || !TOKEN;
}
function markDirty() { setStatus(); renderNavCounts(); }

async function saveContent() {
  if (!TOKEN) return toast('Sign in with a GitHub token to publish.', true);
  const btn = $('#btn-save'); btn.disabled = true; btn.textContent = 'Publishing…';
  try {
    // Re-read sha in case the file changed elsewhere since load
    try { SHA = (await ghGetFile(CONTENT_PATH)).sha; } catch (e) { SHA = null; }
    const json = JSON.stringify(C, null, 2) + '\n';
    const r = await ghPutFile(CONTENT_PATH, b64enc(json), `Update site content via Site Manager (${new Date().toISOString().slice(0, 16).replace('T', ' ')})`, SHA);
    SHA = r.content.sha; C_ORIG = JSON.stringify(C);
    setStatus(); toast('Published. GitHub Pages usually updates within a minute.');
  } catch (e) { toast(e.message, true); setStatus(); }
  btn.textContent = 'Publish changes';
}

// ─────────────────────────────────────────────────────────────────────────────
// Auth modal
// ─────────────────────────────────────────────────────────────────────────────
function showLogin(force = false) {
  const existing = lsGet(LS.token);
  if (existing && !force) { TOKEN = existing; $('#auth-state').textContent = 'Signed in (token saved on this device)'; return Promise.resolve(); }
  return new Promise(resolve => {
    $('#modal-root').innerHTML = `<div class="overlay"><div class="modal">
      <h2>Sign in to GitHub</h2>
      <p class="lead" style="margin-bottom:0.4rem">This page edits <b>${REPO.owner}/${REPO.name}</b> through the GitHub API. The token stays in this browser only.</p>
      <ol>
        <li>GitHub → Settings → Developer settings → <b>Fine-grained tokens</b> → Generate new token</li>
        <li>Repository access: <b>Only select repositories</b> → ${REPO.name}</li>
        <li>Permissions → Repository permissions → <b>Contents: Read and write</b></li>
        <li>Copy the token and paste it below</li>
      </ol>
      <div class="field"><label for="tok">Personal access token</label><input id="tok" type="password" class="mono" placeholder="github_pat_…" autocomplete="off"></div>
      <label class="check" style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)"><input type="checkbox" id="tok-remember" checked> Remember on this device</label>
      <div class="toolbar" style="margin-top:1rem;justify-content:flex-end">
        <button class="btn" id="tok-skip">Continue read-only</button>
        <button class="btn primary" id="tok-go">Sign in</button>
      </div>
      <div class="hint" id="tok-msg"></div>
    </div></div>`;
    $('#tok').focus();
    const done = () => { $('#modal-root').innerHTML = ''; resolve(); };
    $('#tok-skip').onclick = () => { TOKEN = null; $('#auth-state').textContent = 'Read-only (no token)'; done(); };
    $('#tok-go').onclick = async () => {
      const t = $('#tok').value.trim();
      if (!t) return;
      $('#tok-msg').textContent = 'Checking token…';
      TOKEN = t;
      try {
        const repo = await gh(`/repos/${REPO.owner}/${REPO.name}`);
        REPO.branch = repo.default_branch || REPO.branch;
        if (!repo.permissions || !repo.permissions.push) { $('#tok-msg').textContent = 'Token works but has no write access to this repository. You can read, but publishing will fail.'; }
        if ($('#tok-remember').checked) lsSet(LS.token, t);
        $('#auth-state').textContent = 'Signed in' + ($('#tok-remember').checked ? ' (token saved on this device)' : '');
        done();
      } catch (e) { TOKEN = null; $('#tok-msg').textContent = e.message; }
    };
    $('#tok').addEventListener('keydown', e => { if (e.key === 'Enter') $('#tok-go').click(); });
  });
}
$('#link-signout').onclick = async e => { e.preventDefault(); lsSet(LS.token, null); TOKEN = null; await showLogin(true); await loadContent(); };

// ─────────────────────────────────────────────────────────────────────────────
// Navigation
// ─────────────────────────────────────────────────────────────────────────────
const TABS = [
  ['overview', 'Visitors'],
  ['profile', 'Profile'],
  ['research', 'Research interests'],
  ['education', 'Education'],
  ['publications', 'Publications'],
  ['awards', 'Awards'],
  ['photos', 'Photos'],
  ['cv', 'CV & site settings'],
  ['json', 'Raw JSON'],
];
function tabCount(id) {
  if (!C) return '';
  return { research: C.research_interests.length, education: C.education.length, publications: C.publications.length, awards: C.awards.length, photos: C.carousels.flat().length }[id] ?? '';
}
function renderNav() {
  $('#nav').innerHTML = TABS.map(([id, label]) => `<button data-tab="${id}" class="${TAB === id ? 'active' : ''}">${label}<span class="count">${tabCount(id)}</span></button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => { TAB = b.dataset.tab; lsSet(LS.tab, TAB); render(); });
}
function renderNavCounts() { $('#nav').querySelectorAll('button').forEach(b => b.querySelector('.count').textContent = tabCount(b.dataset.tab)); }

// bind(obj, key) returns attributes for an input; onInput writes back
const BIND = new Map(); let bindSeq = 0;
function bind(obj, key, type = 'text', extra = '') {

  const v = obj[key];

  if (type === 'textarea') return `<textarea data-bind="${id}" ${extra}>${esc(v)}</textarea>`;
  if (type === 'select') return `<select data-bind="${id}" ${extra}></select>`;
  return `<input type="${type === 'number' ? 'number' : 'text'}" data-bind="${id}" value="${esc(v ?? '')}" ${extra}>`;
}
function biField(label, obj, key, type = 'text') {
  obj[key] ||= { en: '', zh: '' };
  return `<div class="field"><label>${label}</label><div class="row two">
    <div>${bind(obj[key], 'en', type, 'placeholder="English"')}</div>
    <div>${bind(obj[key], 'zh', type, 'placeholder="中文"')}</div></div></div>`;
}
function field(label, obj, key, type = 'text', hint = '', extra = '') {
  return `<div class="field"><label>${label}</label>${bind(obj, key, type, extra)}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}
function wireBindings(root = document) {
  root.querySelectorAll('[data-bind]').forEach(el => {
    const b = BIND.get(el.dataset.bind); if (!b) return;
    const handler = () => {
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (b.type === 'number') v = el.value === '' ? null : Number(el.value);
      b.obj[b.key] = v; markDirty();
      if (b.onChange) b.onChange(v);
    };
    el.addEventListener('input', handler); el.addEventListener('change', handler);
  });
}
function itemTools(arr, i, onChange) {
  return `<div class="tools">
    <button class="btn" title="Move up" data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button>
    <button class="btn" title="Move down" data-act="down" ${i === arr.length - 1 ? 'disabled' : ''}>↓</button>
    <button class="btn danger" title="Remove" data-act="del">✕</button></div>`;
}
function wireItemTools(root, arr, rerender) {
  root.querySelectorAll('.item[data-i], .thumb[data-i]').forEach(item => {
    const i = Number(item.dataset.i);
    item.querySelectorAll('[data-act]').forEach(btn => btn.onclick = (e) => {
      e.stopPropagation();
      const act = btn.dataset.act;
      if (act === 'up' && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
      if (act === 'down' && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
      if (act === 'del') {
        if (!btn.dataset.confirm) { btn.dataset.confirm = '1'; btn.textContent = 'Remove?'; setTimeout(() => { btn.dataset.confirm = ''; btn.textContent = '✕'; }, 2500); return; }
        arr.splice(i, 1);
      }
      markDirty(); rerender();
    });
  });
}

// ── DOI metadata lookup (Crossref → OpenAlex → Semantic Scholar) ──
function parseDoi(s) { const m = String(s || '').match(/10\.\d{4,9}\/[^\s"<>]+/i); return m ? m[0].replace(/[.,;)]+$/, '') : null; }
function initials(given) { return (given || '').split(/[\s]+/).filter(Boolean).map(w => w.split('-').map(x => x[0].toUpperCase() + '.').join('-')).join(''); }
function fmtAuthor(a) { return a.family ? `${a.family} ${initials(a.given)}`.trim() : (a.name || ''); }
function normName(s) { return String(s || '').toLowerCase().replace(/[^a-z]/g, ''); }
// Convert JATS/HTML fragments to plain text; drops a leading <jats:title>Abstract</jats:title> heading
function stripTags(s) {
  const d = document.createElement('div');
  d.innerHTML = String(s || '').replace(/<jats:title>[^<]*<\/jats:title>/gi, '').replace(/<\/?jats:[^>]*>/gi, ' ');
  return d.textContent.replace(/\s+/g, ' ').trim();
}
function invertedToText(idx) {
  if (!idx) return ''; const words = [];
  Object.entries(idx).forEach(([w, pos]) => pos.forEach(p => { words[p] = w; }));
  return words.join(' ').trim();
}
async function fetchJson(url, headers = {}) { const r = await fetch(url, { headers }); if (!r.ok) throw new Error(`${new URL(url).host} ${r.status}`); return r.json(); }
// Returns a partial publication record built from public metadata APIs
async function lookupDoi(doiInput, status = () => {}) {
  const doi = parseDoi(doiInput); if (!doi) throw new Error('That does not look like a DOI (expected 10.xxxx/…).');
  const out = { doi, url: `https://doi.org/${doi}` };
  const me = normName(C.site.me_author || 'Tang H.');
  status('Crossref…');
  let cr = null;
  try { cr = (await fetchJson(`https://api.crossref.org/works/${encodeURIComponent(doi)}`)).message; } catch (e) {}
  status('OpenAlex…');
  let oa = null;
  try { oa = await fetchJson(`https://api.openalex.org/works/doi:${encodeURIComponent(doi)}`); } catch (e) {}
  if (!cr && !oa) throw new Error('DOI not found in Crossref or OpenAlex.');

  // Title
  out.title = (cr && cr.title && cr.title[0]) || (oa && (oa.display_name || oa.title)) || '';
  out.title = stripTags(out.title);
  // Authors
  let authors = [];
  if (cr && cr.author && cr.author.length) authors = cr.author.map(fmtAuthor);
  else if (oa && oa.authorships) authors = oa.authorships.map(a => { const n = (a.author?.display_name || '').trim().split(/\s+/); return n.length > 1 ? `${n[n.length - 1]} ${initials(n.slice(0, -1).join(' '))}` : n[0]; });
  authors = authors.filter(Boolean);
  out.first_author = authors.length > 0 && normName(authors[0]) === me;
  out.authors = authors.map(a => normName(a) === me ? `<strong>${esc(a)}</strong>` : esc(a)).join(', ');
  // Venue: Journal, vol(issue), pages|article-number
  const journal = stripTags((cr && cr['container-title'] && cr['container-title'][0]) || oa?.primary_location?.source?.display_name || '');
  const vol = cr?.volume || oa?.biblio?.volume || '', issue = cr?.issue || oa?.biblio?.issue || '';
  let pages = (cr?.page || '').replace(/-/g, '–');
  if (!pages && oa?.biblio?.first_page) pages = oa.biblio.first_page + (oa.biblio.last_page && oa.biblio.last_page !== oa.biblio.first_page ? '–' + oa.biblio.last_page : '');
  if (!pages && cr?.['article-number']) pages = cr['article-number'];
  out.venue = journal + (vol ? `, ${vol}` : '') + (issue ? `(${issue})` : '') + (pages ? `, ${pages}` : '');
  out.journal = journal;
  // Year
  const dp = cr?.issued?.['date-parts']?.[0]?.[0] || cr?.['published-online']?.['date-parts']?.[0]?.[0] || oa?.publication_year;
  if (dp) out.year = String(dp);
  // Citations (OpenAlex; differs from Google Scholar)
  if (oa && typeof oa.cited_by_count === 'number') out.cited = oa.cited_by_count;
  // Abstract
  out.abstract = stripTags(cr?.abstract) || invertedToText(oa?.abstract_inverted_index);
  if (!out.abstract) {
    status('Semantic Scholar…');
    try { const ss = await fetchJson(`https://api.semanticscholar.org/graph/v1/paper/DOI:${encodeURIComponent(doi)}?fields=abstract,citationCount`); out.abstract = ss.abstract || ''; if (out.cited == null && typeof ss.citationCount === 'number') out.cited = ss.citationCount; } catch (e) {}
  }
  // Reuse an existing journal cover for the same journal
  if (journal) { const same = C.publications.find(p => p.cover && normName(p.venue).startsWith(normName(journal).slice(0, 12))); if (same) out.cover = same.cover; }
  return out;
}
async function updateAllCitations(btn) {
  const pubs = C.publications.filter(p => p.year !== 'book' && (p.doi || parseDoi(p.url) || parseDoi(p.venue)));
  if (!pubs.length) return toast('No publications with a DOI yet. Add a DOI in each paper to enable this.', true);
  btn.disabled = true; let n = 0, changed = 0;
  for (const p of pubs) {
    btn.textContent = `Updating citations… ${++n}/${pubs.length}`;
    const doi = p.doi || parseDoi(p.url) || parseDoi(p.venue);
    try { const oa = await fetchJson(`https://api.openalex.org/works/doi:${encodeURIComponent(doi)}`); if (typeof oa.cited_by_count === 'number' && oa.cited_by_count !== p.cited) { p.cited = oa.cited_by_count; changed++; } p.doi ||= doi; }
    catch (e) {}
    await new Promise(r => setTimeout(r, 150));
  }
  btn.disabled = false; btn.textContent = 'Update citation counts';
  markDirty(); render(); toast(`Citation counts refreshed from OpenAlex (${changed} changed). Publish to save.`);
}

      } catch (e) { msg.textContent = e.message; btn.disabled = false; }
    });
    // Keep header text live while typing
    box.querySelectorAll('.pub-edit [data-bind]').forEach(el => { const b = BIND.get(el.dataset.bind); if (['title', 'title_short', 'venue'].includes(b.key)) b.onChange = () => { const it = el.closest('.item'); it.querySelector('.t').textContent = b.obj.title_short || b.obj.title || 'Untitled'; }; });
  };
  rr();
  $('#add-pub').onclick = () => {
    const id = 'pub' + Date.now().toString(36);
    pubs.unshift({ id, year: String(new Date().getFullYear()), title: '', title_short: '', authors: '<strong>Tang H.</strong>, ', venue: '', url: '', first_author: true, status: '', cover: '', cited: null, abstract: '', featured: false });

    const base = file.name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-');

    if (openPub) { const p = pubs.find(x => x.id === openPub); if (p) { p.cover = name; markDirty(); } }
    rr();
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Visitors (GoatCounter)
// ─────────────────────────────────────────────────────────────────────────────
let GC_PERIOD = 30;
function viewOverview(v) {
  const code = C.site.goatcounter_code;
  const gcTok = lsGet(LS.gcToken) || '';
  v.innerHTML = `<h2>Visitors</h2><p class="lead">Aggregate, privacy-friendly statistics from GoatCounter: page views, countries and referrers. No individual IP addresses are stored or shown.</p>
  ${!code ? `<div class="card"><h3>Set up GoatCounter (free, ~3 minutes)</h3>
    <ol style="margin:0 0 0.8rem 1.2rem;font-size:13.5px;line-height:1.8">
      <li>Create an account at <a href="https://www.goatcounter.com/signup" target="_blank">goatcounter.com/signup</a> and pick a site code (e.g. <b>tanghuii</b>).</li>
      <li>Enter that code under <b>CV &amp; site settings → GoatCounter site code</b> and publish. Both pages then load the tracking script.</li>
      <li>For charts here: GoatCounter → Settings → <b>API</b> → new token with <b>Read statistics</b>, paste it below.</li>
    </ol></div>` : ''}
  <div class="card">
    <div class="row" style="grid-template-columns:1fr auto;align-items:end">
      <div class="field" style="margin:0"><label>GoatCounter API token (read statistics)</label><input type="password" id="gc-token" class="mono" value="${esc(gcTok)}" placeholder="stored in this browser only"></div>
      <div class="toolbar" style="margin:0"><button class="btn sm" id="gc-save">Save</button>
        ${code ? `<a class="btn sm" href="https://${esc(code)}.goatcounter.com" target="_blank">Open dashboard ↗</a>` : ''}
        ${C.site.ga_id ? `<a class="btn sm" href="https://analytics.google.com/" target="_blank">Google Analytics ↗</a>` : ''}</div></div></div>
  <div id="gc-stats"></div>`;
  $('#gc-save').onclick = () => { lsSet(LS.gcToken, $('#gc-token').value.trim() || null); toast('Saved'); loadStats(); };
  loadStats();
}
// GoatCounter rate-limits the API, so requests run one at a time, retry on 429 and are cached briefly
const GC_CACHE = new Map();
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function gcFetch(url, opts = {}, tries = 4) {
  const hit = GC_CACHE.get(url);
  if (hit && Date.now() - hit.t < 5 * 60 * 1000) return hit.v;
  for (let i = 0; i < tries; i++) {
    const res = await fetch(url, opts);
    if (res.status === 429) {
      const reset = Number(res.headers.get('X-Rate-Limit-Reset') || res.headers.get('Retry-After')) || (i + 1) * 2;
      await sleep(Math.min(reset, 15) * 1000 + 300);
      continue;
    }
    if (res.status === 404) { GC_CACHE.set(url, { t: Date.now(), v: null }); return null; }
    if (!res.ok) throw new Error(`GoatCounter ${res.status}`);
    const v = await res.json();
    GC_CACHE.set(url, { t: Date.now(), v });
    await sleep(350);
    return v;
  }
  throw new Error('GoatCounter is rate-limiting requests; try again in a minute');
}
async function gcApi(code, token, path) {
  return gcFetch(`https://${code}.goatcounter.com/api/v0${path}`, { headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } });
}
let GC_LOADING = 0;
const fmtN = n => Number(n || 0).toLocaleString('en-US');
const dstr = d => d.toISOString().slice(0, 10);
async function loadStats() {
  const box = $('#gc-stats'); if (!box) return;
  const code = C.site.goatcounter_code; const token = lsGet(LS.gcToken);
  if (!code) { box.innerHTML = ''; return; }
  const run = ++GC_LOADING; // ignore results of superseded loads
  box.innerHTML = `<div class="toolbar"><div class="seg" id="gc-seg">${[7, 30, 90, 365].map(d => `<button data-d="${d}" class="${GC_PERIOD === d ? 'active' : ''}">${d === 365 ? '1 year' : d + ' days'}</button>`).join('')}</div><span class="hint" id="gc-msg">Loading…</span></div><div id="gc-body"></div>`;
  box.querySelectorAll('#gc-seg button').forEach(b => b.onclick = () => { GC_PERIOD = Number(b.dataset.d); loadStats(); });
  const body = $('#gc-body'), msg = $('#gc-msg');
  const stale = () => run !== GC_LOADING || !body.isConnected;
  const end = new Date(); const start = new Date(end.getTime() - GC_PERIOD * 86400000);
  const isHome = p => p === '/' || p === '/index.html' || p === '/index';
  const isPubs = p => p === '/publications.html' || p === '/publications';
  const tiles = (all, home, pubs, sub = '') => `<div class="tiles">
    <div class="tile"><div class="k">Page views</div><div class="v">${all}</div><div class="s">last ${GC_PERIOD === 365 ? '12 months' : GC_PERIOD + ' days'}, all pages</div></div>
    <div class="tile"><div class="k">Homepage</div><div class="v">${home}</div><div class="s">/ and index.html</div></div>
    <div class="tile"><div class="k">Publications page</div><div class="v">${pubs}</div><div class="s">publications.html${sub}</div></div></div>`;

  // Without an API token: public counters only (needs "Allow adding visitor counts" in GoatCounter settings)
  if (!token) {
    const q = `?start=${dstr(start)}&end=${dstr(end)}`;
    const get = async p => { try { return await gcFetch(`https://${code}.goatcounter.com/counter/${encodeURIComponent(p)}.json${q}`); } catch (e) { return null; } };
    const num = x => x ? Number(String(x.count ?? 0).replace(/[^\d]/g, '')) : 0;
    const all = await get('TOTAL'); if (stale()) return;
    const h1 = await get('/'), h2 = await get('/index.html'), p1 = await get('/publications.html'); if (stale()) return;
    body.innerHTML = tiles(all ? fmtN(num(all)) : '–', fmtN(num(h1) + num(h2)), fmtN(num(p1)))
      + `<div class="card"><p class="hint">Add a GoatCounter API token above to see daily trends, countries and referrers here.${all ? '' : ' If the counts stay at “–”, enable <b>Settings → Allow adding visitor counts on your website</b> in GoatCounter.'}</p></div>`;
    msg.textContent = ''; return;
  }

  // With an API token: four sequential API calls
  const q = `?start=${dstr(start)}T00:00:00Z&end=${dstr(end)}T23:59:59Z`;
  try {
    msg.textContent = 'Loading totals…';
    const total = await gcApi(code, token, `/stats/total${q}`); if (stale()) return;
    msg.textContent = 'Loading pages…';
    const hits = await gcApi(code, token, `/stats/hits${q}&limit=50`); if (stale()) return;
    msg.textContent = 'Loading countries…';
    const locs = await gcApi(code, token, `/stats/locations${q}&limit=15`); if (stale()) return;
    msg.textContent = 'Loading referrers…';
    const refs = await gcApi(code, token, `/stats/toprefs${q}&limit=15`); if (stale()) return;

    const pages = (hits?.hits || []).filter(h => !h.event);
    const sum = arr => arr.reduce((a, h) => a + (h.count ?? 0), 0);
    const allViews = total?.total ?? sum(pages);
    // Daily series from /stats/total; fall back to summing per-page stats
    const daily = {};
    if (total?.stats?.length) total.stats.forEach(s => { daily[s.day] = (daily[s.day] || 0) + (s.daily ?? (s.hourly || []).reduce((a, b) => a + b, 0)); });
    else pages.forEach(h => (h.stats || []).forEach(s => { daily[s.day] = (daily[s.day] || 0) + (s.daily ?? (s.hourly || []).reduce((a, b) => a + b, 0)); }));
    const days = Object.keys(daily).sort(); const vals = days.map(d => daily[d]);

    let html = tiles(fmtN(allViews), fmtN(sum(pages.filter(h => isHome(h.path)))), fmtN(sum(pages.filter(h => isPubs(h.path)))));
    if (!allViews) html += `<div class="card"><p class="hint">No visits recorded yet. GoatCounter only counts visits after the tracking script is live: check that the site code is published under <b>CV &amp; site settings</b>, then open the website once and come back in a few minutes. Your own visits from this browser may be ignored if you enabled that in GoatCounter.</p></div>`;
    else html += `<div class="card"><h3>Daily page views</h3>${sparkline(days, vals)}</div>
      <div class="two-col">
        <div class="card"><h3>Countries</h3>${bars((locs?.stats || []).map(x => ({ name: x.name || x.id || 'Unknown', n: x.count })))}</div>
        <div class="card"><h3>Referrers</h3>${bars((refs?.stats || []).map(x => ({ name: x.name || x.id || '(direct)', n: x.count })))}</div>
      </div>
      <div class="card"><h3>Pages</h3>${bars(pages.map(h => ({ name: h.path, n: h.count })))}</div>`;
    body.innerHTML = html; msg.textContent = '';
  } catch (e) {
    if (stale()) return;
    body.innerHTML = `<div class="card"><p class="hint">Could not load statistics (${esc(e.message)}). If this says 401 or 403, the API token needs the <b>Read statistics</b> permission. You can always open the GoatCounter dashboard directly.</p></div>`;
    msg.textContent = '';
  }
}
function bars(items) {
  items = items.filter(x => x.n != null); if (!items.length) return '<p class="hint">No data in this period.</p>';
  const max = Math.max(...items.map(x => Number(x.n) || 0), 1);
  return `<div class="bars">${items.map(x => `<div class="bar"><div class="name" title="${esc(x.name)}">${esc(x.name)}</div><div class="track"><div class="fill" style="width:${(Number(x.n) / max * 100).toFixed(1)}%"></div></div><div class="n">${fmtN(x.n)}</div></div>`).join('')}</div>`;
}
function sparkline(days, vals) {
  if (!vals.length) return '<p class="hint">No data in this period.</p>';
  const W = 800, H = 160, padL = 36, padB = 22, padT = 8;
  const max = Math.max(...vals, 1), n = vals.length;
  const x = i => padL + (n === 1 ? 0 : i * (W - padL - 8) / (n - 1));
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area = `M${x(0).toFixed(1)},${y(0)} L${pts.replace(/ /g, ' L')} L${x(n - 1).toFixed(1)},${y(0)} Z`;
  const ticks = [0, Math.round(max / 2), max];
  const labelEvery = Math.ceil(n / 6);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily page views">
    ${ticks.map(t => `<line x1="${padL}" x2="${W - 8}" y1="${y(t)}" y2="${y(t)}" stroke="#d4cdc4" stroke-dasharray="2 4"/><text x="${padL - 6}" y="${y(t) + 4}" font-size="11" text-anchor="end" fill="#8a8279" font-family="DM Sans, sans-serif">${t}</text>`).join('')}
    <path d="${area}" fill="#a67c52" fill-opacity="0.15"/>
    <polyline points="${pts}" fill="none" stroke="#6b4c3b" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(n - 1)}" cy="${y(vals[n - 1])}" r="3.5" fill="#6b4c3b"/>
    ${days.map((d, i) => i % labelEvery === 0 || i === n - 1 ? `<text x="${x(i)}" y="${H - 6}" font-size="11" text-anchor="${i === n - 1 && n > 1 ? 'end' : i === 0 ? 'start' : 'middle'}" fill="#8a8279" font-family="DM Sans, sans-serif">${d.slice(5)}</text>` : '').join('')}
  </svg>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────
$('#btn-save').onclick = saveContent;
$('#btn-reload').onclick = async () => { if (isDirty() && !$('#btn-reload').dataset.confirm) { $('#btn-reload').dataset.confirm = '1'; $('#btn-reload').textContent = 'Discard changes & reload?'; setTimeout(() => { $('#btn-reload').dataset.confirm = ''; $('#btn-reload').textContent = 'Reload from GitHub'; }, 3000); return; } $('#btn-reload').dataset.confirm = ''; $('#btn-reload').textContent = 'Reload from GitHub'; await loadContent(); };
window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
(async () => {
  TAB = lsGet(LS.tab) || 'overview';
  await showLogin();
  await loadContent();
})();
</script>
