<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1WEB63LSGJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-1WEB63LSGJ');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publications | Hui Tang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@400;500;600&family=Pinyon+Script&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1a2e;
      --paper: #faf8f5;
      --accent: #6b4c3b;
      --accent-light: #a67c52;
      --subtle: #d4cdc4;
      --muted: #8a8279;
      --highlight: #f0ebe4;
      --card-bg: #ffffff;
      --shadow: rgba(26, 26, 46, 0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    body.zh { font-family: 'Noto Serif SC', 'DM Sans', serif; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
    }

    .top-bar {
      position: fixed; top: 0; width: 100%; z-index: 50;
      backdrop-filter: blur(16px);
      background: rgba(250, 248, 245, 0.88);
      border-bottom: 1px solid var(--subtle);
      height: 60px; display: flex; align-items: center;
    }
    .top-bar-inner {
      max-width: 1100px; width: 100%; margin: 0 auto; padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 0.4rem;
      text-decoration: none; font-family: 'Pinyon Script', cursive;
      font-size: 1.5rem; color: var(--accent); transition: opacity 0.25s;
    }
    .back-link:hover { opacity: 0.7; }
    .back-arrow { font-family: 'DM Sans', sans-serif; font-size: 0.85rem; opacity: 0.6; }
    .lang-toggle { display: flex; border: 1px solid var(--subtle); border-radius: 100px; overflow: hidden; background: var(--card-bg); }
    .lang-btn { padding: 0.3rem 0.7rem; font-size: 0.75rem; font-weight: 600; border: none; background: transparent; color: var(--muted); cursor: pointer; transition: all 0.25s; }
    .lang-btn.active { background: var(--accent); color: #fff; }

    .page-header {
      max-width: 1100px; margin: 0 auto; padding: 100px 2rem 2rem;
    }
    .page-header h1 {
      font-family: 'Crimson Pro', serif; font-size: 2.4rem; font-weight: 300;
      color: var(--ink); margin-bottom: 0.3rem;
    }
    body.zh .page-header h1 { font-family: 'Noto Serif SC', serif; }
    .page-header .subtitle { font-size: 0.92rem; color: var(--muted); }
    .stats-row { display: flex; gap: 2rem; margin-top: 1.2rem; flex-wrap: wrap; }
    .stat { display: flex; align-items: baseline; gap: 0.4rem; }
    .stat-num { font-family: 'Crimson Pro', serif; font-size: 1.8rem; font-weight: 600; color: var(--accent); }
    .stat-label { font-size: 0.82rem; color: var(--muted); }

    .year-section { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem 0.5rem; }
    .year-label {
      font-family: 'Crimson Pro', serif; font-size: 1.6rem; font-weight: 600;
      color: var(--accent); display: flex; align-items: center; gap: 1rem;
    }
    .year-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--subtle), transparent); }

    .pub-grid {
      max-width: 1100px; margin: 0 auto; padding: 1rem 2rem;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 1.2rem;
    }

    .pub-card {
      display: flex; gap: 1.2rem;
      background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(240,235,228,0.5) 100%);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(212,205,196,0.4);
      border-radius: 12px; padding: 1.4rem;
      transition: all 0.35s ease; text-decoration: none; color: inherit;
      cursor: pointer; flex-wrap: wrap;
      position: relative;
      overflow: hidden;
    }
    .pub-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .pub-card:hover::before { opacity: 1; }
    .pub-card:hover {
      border-color: rgba(166,124,82,0.3);
      box-shadow: 0 12px 36px rgba(26,26,46,0.1), 0 2px 8px rgba(107,76,59,0.06);
      transform: translateY(-4px);
      background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(240,235,228,0.7) 100%);
    }

    .pub-card .pub-title {
      font-weight: 600; font-size: 0.92rem; color: var(--ink);
      line-height: 1.45; margin-bottom: 0.4rem;
    }
    .pub-card .pub-title a {
      color: var(--ink);
      text-decoration: none;
      transition: color 0.2s;
    }
    .pub-card .pub-title a:hover {
      color: var(--accent);
    }

    .pub-abstract {
      width: 100%;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.4s ease, opacity 0.3s ease;
      opacity: 0;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.7;
      border-top: 1px solid transparent;
      padding: 0 0.2rem;
    }
    .pub-card.expanded .pub-abstract {
      max-height: 2000px;
      opacity: 1;
      padding: 0.8rem 0.2rem 0;
      border-top-color: rgba(212,205,196,0.5);
      margin-top: 0.5rem;
    }
    /* Clamp abstract text to 5 lines with ellipsis; remove clamp when expanded */
    .pub-abstract p {
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pub-card.expanded .pub-abstract p {
      display: block;
      -webkit-line-clamp: unset;
      overflow: visible;
    }
    .abstract-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }
    .expand-hint {
      font-size: 0.7rem;
      color: var(--subtle);
      margin-top: 0.4rem;
      transition: color 0.2s;
    }
    .pub-card:hover .expand-hint { color: var(--accent-light); }

    .journal-cover {
      width: 90px; height: 120px; border-radius: 6px; object-fit: cover;
      flex-shrink: 0; background: var(--highlight); border: 1px solid var(--subtle);
    }

    /* SVG placeholder covers */
    .cover-placeholder {
      width: 90px; height: 120px; border-radius: 6px; flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 0.5rem; font-size: 0.65rem; font-weight: 600;
      line-height: 1.3; border: 1px solid var(--subtle);
    }
    .cover-tree { background: linear-gradient(135deg, #1a3a2a, #2d5a3f); color: #c8e6c9; }
    .cover-ppg { background: linear-gradient(135deg, #1a237e, #3949ab); color: #c5cae9; }
    .cover-ldd { background: linear-gradient(135deg, #4e342e, #795548); color: #d7ccc8; }
    .cover-gec { background: linear-gradient(135deg, #1b5e20, #388e3c); color: #c8e6c9; }
    .cover-lup { background: linear-gradient(135deg, #263238, #455a64); color: #b0bec5; }
    .cover-gs { background: linear-gradient(135deg, #004d40, #00796b); color: #b2dfdb; }
    .cover-le { background: linear-gradient(135deg, #33691e, #558b2f); color: #dcedc8; }
    .cover-jem { background: linear-gradient(135deg, #0d47a1, #1976d2); color: #bbdefb; }
    .cover-book { background: linear-gradient(135deg, #b71c1c, #d32f2f); color: #ffcdd2; }
    .cover-inprep {
      background: linear-gradient(135deg, var(--highlight), var(--subtle));
      color: var(--accent); border: 2px dashed var(--subtle);
    }

    .pub-info { flex: 1; min-width: 0; }
    .pub-card .pub-title { font-weight: 600; font-size: 0.92rem; color: var(--ink); line-height: 1.45; margin-bottom: 0.4rem; }
    .pub-card .pub-authors { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.25rem; }
    .pub-card .pub-authors strong { color: var(--accent); font-weight: 600; }
    .pub-card .pub-venue { font-size: 0.8rem; font-style: italic; color: var(--accent-light); margin-bottom: 0.5rem; }
    .pub-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .pub-badge { display: inline-block; font-size: 0.68rem; font-weight: 600; padding: 0.12rem 0.5rem; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
    .badge-first { background: #fef3c7; color: #92400e; }
    .badge-review { background: #e0e7ff; color: #3730a3; }
    .pub-link-btn {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.75rem; font-weight: 500; padding: 0.25rem 0.65rem;
      border: 1px solid var(--subtle); border-radius: 4px; text-decoration: none;
      color: var(--muted); transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .pub-link-btn:hover { color: var(--accent); border-color: var(--accent); }

    .cite-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--highlight);
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }
    .cite-badge svg { width: 11px; height: 11px; opacity: 0.7; }

    footer {
      max-width: 1100px; margin: 3rem auto 0; padding: 2rem;
      border-top: 1px solid var(--subtle); text-align: center;
      font-size: 0.82rem; color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pub-card { animation: fadeUp 0.5s ease both; }
    .pub-grid .pub-card:nth-child(1) { animation-delay: 0s; }
    .pub-grid .pub-card:nth-child(2) { animation-delay: 0.05s; }
    .pub-grid .pub-card:nth-child(3) { animation-delay: 0.1s; }
    .pub-grid .pub-card:nth-child(4) { animation-delay: 0.15s; }
    .pub-grid .pub-card:nth-child(5) { animation-delay: 0.2s; }
    .pub-grid .pub-card:nth-child(6) { animation-delay: 0.25s; }
    .pub-grid .pub-card:nth-child(7) { animation-delay: 0.3s; }

    @media (max-width: 580px) {
      .pub-grid { grid-template-columns: 1fr; }
      .page-header h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-inner">
    <a href="index.html" class="back-link"><span class="back-arrow">←</span> <span id="back-name">Hui Tang</span></a>
    <div class="lang-toggle" id="lang-toggle">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="zh">中</button>
    </div>
  </div>
</div>

<div class="page-header">
  <h1 data-en="Publications" data-zh="学术论文">Publications</h1>
  <p class="subtitle" data-en="Peer-reviewed journal articles and books" data-zh="同行评审期刊论文与著作">Peer-reviewed journal articles and books</p>
  <div class="stats-row" id="stats-row"></div>
</div>

<!-- Publication list is rendered from content.json -->
<div id="pub-list"></div>

<footer>
  <p><a href="index.html" data-en="← Back to Homepage" data-zh="← 返回主页">← Back to Homepage</a> &nbsp;&middot;&nbsp; &copy; <span id="footer-year">2026</span> <span id="footer-name">Hui Tang</span></p>
</footer>

<script>
  let currentLang = 'en';
  let CONTENT = null;

  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const attr = s => String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  const CITE_ICON = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>';

  function pubCard(p) {
    const isBook = p.year === 'book';
    const cover = p.cover
      ? `<img class="journal-cover" src="${attr(p.cover)}" alt="${attr(p.venue)}" loading="lazy">`
      : `<div class="cover-placeholder cover-inprep">📝<br><br>${esc(p.status === 'In Prep' ? 'In Preparation' : (p.status || 'In Preparation')).replace(' ', '<br>')}</div>`;
    const title = p.url
      ? `<a href="${attr(p.url)}" target="_blank" onclick="event.stopPropagation()">${esc(p.title)}</a>`
      : esc(p.title);
    let badges = '';
    if (p.first_author) badges += '<span class="pub-badge badge-first">First Author</span>';
    if (p.status) badges += `<span class="pub-badge badge-review">${esc(p.status)}</span>`;
    if (p.url) badges += `<a class="pub-link-btn" href="${attr(p.url)}" target="_blank" data-en="Read" data-zh="原文">Read</a>`;
    if (p.cited !== null && p.cited !== undefined && p.cited !== '') badges += `<span class="cite-badge">${CITE_ICON} Cited: ${esc(p.cited)}</span>`;
    const hasAbstract = !isBook;
    const abstract = hasAbstract ? `<div class="pub-abstract"><div class="abstract-label">Abstract</div><p>${esc(p.abstract || 'Coming soon.')}</p></div>` : '';
    const hint = hasAbstract ? '<div class="expand-hint" data-en="Click to view abstract" data-zh="点击查看摘要">Click to view abstract</div>' : '';
    const style = isBook ? ' style="background: linear-gradient(135deg, var(--highlight) 0%, var(--card-bg) 100%); border: 1px solid var(--subtle);"' : '';
    return `<div class="pub-card"${style}>${cover}
      <div class="pub-info">
        <div class="pub-title">${title}</div>
        <div class="pub-authors">${p.authors}</div>
        <div class="pub-venue">${esc(p.venue)}</div>
        ${badges ? `<div class="pub-badges">${badges}</div>` : ''}
        ${hint}
      </div>${abstract}</div>`;
  }

  function render() {
    const pubs = CONTENT.publications || [];
    const groups = {};
    pubs.forEach(p => { (groups[p.year] = groups[p.year] || []).push(p); });
    const years = Object.keys(groups).filter(y => y !== 'book').sort((a, b) => b.localeCompare(a));
    if (groups.book) years.push('book');
    document.getElementById('pub-list').innerHTML = years.map(y => `
      <div class="year-section">${y === 'book' ? '<div class="year-label" data-en="Book" data-zh="著作">Book</div>' : `<div class="year-label">${esc(y)}</div>`}</div>
      <div class="pub-grid">${groups[y].map(pubCard).join('')}</div>`).join('');

    // Summary stats derived from the data
    const nBook = (groups.book || []).length;
    const nFirst = pubs.filter(p => p.first_author).length;
    document.getElementById('stats-row').innerHTML = `
      <div class="stat"><span class="stat-num">${pubs.length - nBook}</span><span class="stat-label" data-en="Publications" data-zh="篇论文">Publications</span></div>
      <div class="stat"><span class="stat-num">${nFirst}</span><span class="stat-label" data-en="First Author" data-zh="篇第一作者">First Author</span></div>
      <div class="stat"><span class="stat-num">${nBook}</span><span class="stat-label" data-en="Book" data-zh="部著作">Book</span></div>`;

    document.getElementById('back-name').textContent = CONTENT.profile?.name_en || 'Hui Tang';
    document.getElementById('footer-name').textContent = CONTENT.profile?.name_en || 'Hui Tang';
    document.getElementById('footer-year').textContent = CONTENT.site?.footer_year || new Date().getFullYear();

    // Click to expand abstract
    document.querySelectorAll('.pub-card').forEach(card => {
      if (!card.querySelector('.pub-abstract')) return;
      card.addEventListener('click', function (e) {
        if (e.target.closest('a')) return;
        this.classList.toggle('expanded');
        const hint = this.querySelector('.expand-hint');
        if (hint) {
          const isOpen = this.classList.contains('expanded');
          hint.textContent = isOpen
            ? (currentLang === 'zh' ? '点击收起' : 'Click to collapse')
            : (currentLang === 'zh' ? '点击查看摘要' : 'Click to view abstract');
        }
      });
    });
  }

  function injectGoatCounter(code) {
    if (!code) return;
    const s = document.createElement('script');
    s.async = true;
    s.dataset.goatcounter = `https://${code}.goatcounter.com/count`;
    s.src = '//gc.zgo.at/count.js';
    document.head.appendChild(s);
  }

  function applyLang(lang) {
    currentLang = lang;
    document.querySelectorAll('#lang-toggle .lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    document.body.classList.toggle('zh', lang === 'zh');
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-en][data-zh]').forEach(el => {
      const badges = el.querySelectorAll('.pub-badge, .pub-link-btn');
      let preserved = '';
      badges.forEach(n => { preserved += ' ' + n.outerHTML; });
      el.innerHTML = el.getAttribute('data-' + lang) + preserved;
    });
    if (CONTENT) document.title = CONTENT.site.pub_page_title?.[lang] || 'Publications | Hui Tang';
  }
  document.getElementById('lang-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('.lang-btn');
    if (!btn || btn.dataset.lang === currentLang) return;
    applyLang(btn.dataset.lang);
  });

  (async function boot() {
    try {
      const res = await fetch('content.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      CONTENT = await res.json();
    } catch (err) {
      document.getElementById('pub-list').innerHTML = `<p style="text-align:center;color:var(--muted)">Failed to load content.json (${esc(err.message)}).</p>`;
      return;
    }
    render();
    injectGoatCounter(CONTENT.site?.goatcounter_code);
    applyLang(currentLang);
  })();
</script>
</body>
</html>
